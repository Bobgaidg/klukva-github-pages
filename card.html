<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Демонстрационная витрина KLUKVA: каталог тестовых товаров и страницы брендов.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Карточка товара — Клюква</title>
<script>(function(){try{var t=localStorage.getItem('klukva-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header" class="site-header"></div>
<aside class="demo-notice" aria-label="Демонстрационная версия">Демонстрация · Тестовые товары и бренды. <a href="demo.html">Подробнее</a></aside>
<main class="page">
  <p><a href="catalog.html">← Назад в каталог</a></p>
  <div id="card-detail"></div>
</main>
<div id="photo-fullscreen" class="photo-fullscreen" hidden>
  <button type="button" id="photo-fullscreen-close" class="photo-fullscreen-close" aria-label="Закрыть">×</button>
  <button type="button" class="gallery-arrow gallery-arrow-prev photo-fullscreen-arrow" onclick="galleryStep(-1)" aria-label="Предыдущее фото">‹</button>
  <img id="photo-fullscreen-img" class="photo-fullscreen-img" alt="Фото во весь экран" onerror="handleFullscreenPhotoError(this)">
  <p id="photo-fullscreen-error" class="photo-fullscreen-error" hidden>Фото не загрузилось. <a href="mailto:hello@klukvaconcept.store">Сообщите нам</a></p>
  <button type="button" class="gallery-arrow gallery-arrow-next photo-fullscreen-arrow" onclick="galleryStep(1)" aria-label="Следующее фото">›</button>
</div>
<div id="site-footer" class="site-footer"></div>
<script src="js/partials.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/catalog.js"></script>
<script src="js/recently-viewed.js"></script>
<script src="js/card.js"></script>
<script src="js/cookie-banner.js"></script>
</body>
</html>
